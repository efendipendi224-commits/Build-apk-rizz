name: Build App

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      # 1. Membuat file pubspec.yaml otomatis jika belum ada
      - name: Ensure pubspec.yaml exists
        run: |
          if [ ! -f pubspec.yaml ]; then
            echo "name: build_apk_rizz" > pubspec.yaml
            echo "environment:" >> pubspec.yaml
            echo "  sdk: '>=3.0.0 <4.0.0'" >> pubspec.yaml
            echo "dependencies:" >> pubspec.yaml
            echo "  flutter:" >> pubspec.yaml
            echo "    sdk: flutter" >> pubspec.yaml
            echo "flutter:" >> pubspec.yaml
            echo "  uses-material-design: true" >> pubspec.yaml
          fi

      # 2. Membuat folder lib dan main.dart otomatis jika belum ada
      - name: Ensure main.dart exists
        run: |
          mkdir -p lib
          if [ ! -f lib/main.dart ]; then
            echo "import 'package:flutter/material.dart';" > lib/main.dart
            echo "void main() => runApp(const MyApp());" >> lib/main.dart
            echo "class MyApp extends StatelessWidget {" >> lib/main.dart
            echo "  const MyApp({super.key});" >> lib/main.dart
            echo "  @override" >> lib/main.dart
            echo "  Widget build(BuildContext context) {" >> lib/main.dart
            echo "    return MaterialApp(home: Scaffold(body: Center(child: Text('Aplikasi Berhasil Dibuat!'))));" >> lib/main.dart
            echo "  }" >> lib/main.dart
            echo "}" >> lib/main.dart
          fi

      # 3. Membuat folder Android otomatis
      - name: Create Android Folder
        run: flutter create . --platforms=android

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
